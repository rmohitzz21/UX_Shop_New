; PHP per-directory overrides. Applies to this directory and subdirs on PHP-FPM
; and on cPanel-style hosts. Picked up by PHP without server restart (after the
; user_ini.cache_ttl window — default 5 minutes).

; Buffer 4 KB of output at request start so a stray UTF-8 BOM or whitespace
; before <?php cannot prevent header()/session_start() from working.
output_buffering = 4096

; Compress responses transparently (mod_deflate may not be available on all hosts).
zlib.output_compression = On
zlib.output_compression_level = 6

; Hide PHP version from the Server response header.
expose_php = Off
